<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590">
  <rect width="1100" height="590" rx="18" fill="#f8fafc"/>
  <text x="550" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#0f172a">Diagnosing TCP Connection Failures</text>
  <text x="550" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Logical topology • Kali Linux VM • Isolated network namespaces</text>

  <rect x="35" y="100" width="1030" height="365" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="550" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#334155">Kali Linux VM</text>

  <rect x="75" y="165" width="355" height="230" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="252" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#1e3a8a">TCP Lab Client</text>
  <text x="252" y="226" text-anchor="middle" font-family="monospace" font-size="16" fill="#1e40af">tcp-lab-client</text>
  <line x1="105" y1="244" x2="400" y2="244" stroke="#bfdbfe" stroke-width="2"/>
  <text x="252" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">192.0.2.10/24</text>
  <text x="252" y="309" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">curl — HTTP client</text>
  <text x="252" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">tcpdump — packet capture</text>
  <text x="252" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Interface: veth-labclient</text>

  <rect x="670" y="165" width="355" height="230" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="847" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#14532d">TCP Lab Server</text>
  <text x="847" y="226" text-anchor="middle" font-family="monospace" font-size="16" fill="#166534">tcp-lab-server</text>
  <line x1="700" y1="244" x2="995" y2="244" stroke="#bbf7d0" stroke-width="2"/>
  <text x="847" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">192.0.2.20/24</text>
  <text x="847" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">Python HTTP server: TCP/8080</text>
  <text x="847" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">iptables + tcpdump</text>
  <text x="847" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Interface: veth-labserver</text>

  <line x1="430" y1="278" x2="670" y2="278" stroke="#64748b" stroke-width="4"/>
  <path d="M 657 269 L 670 278 L 657 287" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 443 269 L 430 278 L 443 287" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="452" y="241" width="196" height="28" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="550" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">Virtual Ethernet pair</text>
  <text x="550" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">veth link</text>

  <rect x="75" y="420" width="950" height="29" rx="7" fill="#fff7ed" stroke="#fdba74"/>
  <text x="550" y="439" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#9a3412">Controlled fault: server INPUT rule drops TCP packets destined for port 8080</text>

  <text x="550" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Investigation sequence</text>
  <rect x="120" y="525" width="235" height="42" rx="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="237" y="551" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#166534">1. Baseline: HTTP works</text>
  <path d="M 365 546 L 394 546" stroke="#64748b" stroke-width="2"/>
  <path d="M 387 540 L 394 546 L 387 552" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="405" y="525" width="290" height="42" rx="9" fill="#ffedd5" stroke="#ea580c"/>
  <text x="550" y="551" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#9a3412">2. Failure: repeated SYNs</text>
  <path d="M 705 546 L 734 546" stroke="#64748b" stroke-width="2"/>
  <path d="M 727 540 L 734 546 L 727 552" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="745" y="525" width="235" height="42" rx="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="862" y="551" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#166534">3. Recovery: HTTP works</text>
</svg>
